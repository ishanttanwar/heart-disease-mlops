# CI/CD pipeline for the heart disease API.
#
#   lint-and-test  flake8 + pytest, then retrain the model and upload it
#   docker         build the image, run the container, smoke test it
#   kubernetes     deploy to a throwaway kind cluster and verify the service
#
# Each job fails the whole run on any error, and every job uploads its logs
# and artifacts. Docker and Kubernetes run on the GitHub runner, which has
# both preinstalled.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you start a run by hand from the Actions tab

env:
  PYTHON_VERSION: "3.12"
  IMAGE: heart-disease-api:ci

jobs:
  lint-and-test:
    name: Lint, test and train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 src tests scripts

      - name: Unit tests
        run: pytest -v --junitxml=reports/pytest.xml

      - name: Train model (quick grid)
        run: python -m src.train --quick --no-register

      - name: Check the trained model serves a prediction
        run: python -m src.predict

      - name: Upload model, metrics and test report
        if: always()          # keep artifacts even when a step above failed
        uses: actions/upload-artifact@v4
        with:
          name: model-and-reports
          path: |
            models/
            reports/
            screenshots/training/
          if-no-files-found: warn

  docker:
    name: Build and run container
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ env.IMAGE }} .

      - name: Start container
        run: |
          docker run -d --name heart-api -p 8000:8000 ${{ env.IMAGE }}
          docker ps

      - name: Smoke test the running container
        run: python scripts/smoke_test.py --url http://localhost:8000 --wait 60

      - name: Container logs
        if: always()
        run: docker logs heart-api | tee docker-logs.txt

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-logs.txt

      - name: Stop container
        if: always()
        run: docker rm -f heart-api

  kubernetes:
    name: Deploy to Kubernetes (kind)
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: heart-ci

      - name: Build image and load it into the cluster
        run: |
          docker build -t ${{ env.IMAGE }} .
          kind load docker-image ${{ env.IMAGE }} --name heart-ci

      - name: Apply manifests
        run: |
          sed -i 's|image: heart-disease-api:1.0|image: ${{ env.IMAGE }}|' \
            k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml

      - name: Wait for the rollout
        run: |
          kubectl rollout status deployment/heart-api --timeout=180s
          kubectl get pods,svc -o wide

      - name: Verify the service answers
        run: |
          kubectl port-forward service/heart-api 8080:80 &
          python scripts/smoke_test.py --url http://localhost:8080 --wait 60

      - name: Cluster state and pod logs
        if: always()
        run: |
          kubectl get all > k8s-state.txt
          kubectl describe deployment heart-api >> k8s-state.txt
          kubectl logs -l app=heart-api --tail=50 --all-containers \
            > k8s-pod-logs.txt || true
          cat k8s-state.txt

      - name: Upload Kubernetes logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-logs
          path: |
            k8s-state.txt
            k8s-pod-logs.txt
