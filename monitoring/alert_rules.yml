# Alert rules: the three failure modes worth waking someone for.
groups:
  - name: heart-api
    rules:
      - alert: ApiDown
        expr: up{job="heart-disease-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prediction API is not responding to scrapes"

      - alert: ModelNotLoaded
        expr: model_loaded == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API is up but the model failed to load"

      - alert: HighErrorRate
        expr: >
          sum(rate(api_requests_total{status=~"5.."}[5m]))
          / sum(rate(api_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests are failing"

      - alert: SlowPredictions
        expr: >
          histogram_quantile(
            0.95,
            sum(rate(api_request_latency_seconds_bucket{endpoint="/predict"}[5m]))
            by (le)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile prediction latency above 1 second"
